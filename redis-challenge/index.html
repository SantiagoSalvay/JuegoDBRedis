<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Redis Challenge ⚡</title>
        <meta
            name="description"
            content="Quiz interactivo sobre Redis para competencias educativas"
        />
        <meta name="theme-color" content="#D82C20" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                width: 100%;
                overflow-x: hidden;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #1e1e1e;
                color: white;
            }

            #root {
                height: 100vh;
                width: 100vw;
                display: flex;
                flex-direction: column;
            }

            /* Loading screen */
            .loading {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                background: #1e1e1e;
                color: #d82c20;
                font-size: 24px;
                font-weight: bold;
            }

            /* Prevent zoom on mobile */
            input,
            select,
            textarea {
                font-size: 16px;
            }

            /* Smooth scrolling */
            * {
                scroll-behavior: smooth;
            }

            /* Hide scrollbar but keep functionality */
            ::-webkit-scrollbar {
                width: 8px;
            }

            ::-webkit-scrollbar-track {
                background: #1e1e1e;
            }

            ::-webkit-scrollbar-thumb {
                background: #d82c20;
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #b82419;
            }
        </style>
    </head>
    <body>
        <div id="root">
            <div class="loading">
                <div>⚡ Cargando Redis Challenge...</div>
            </div>
        </div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
